<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PhotoStamp — Date & Photographer Watermarker</title>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f0f11;
    --surface:   #1a1a1f;
    --border:    #2e2e38;
    --accent:    #e8c87a;
    --accent2:   #7ab8e8;
    --text:      #e8e6e1;
    --muted:     #888690;
    --danger:    #e87a7a;
    --success:   #7ae89a;
    --radius:    10px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: #ffffff;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── Noise texture overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  /* ── Layout ── */
  .wrap {
    position: relative; z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── Header ── */
  header {
    padding: 56px 0 36px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--text);
  }
  .logo span { color: var(--accent); font-style: italic; }

  .tagline {
    margin-top: 10px;
    color: var(--muted);
    font-size: 1rem;
    font-weight: 300;
  }

  /* ── Two-column layout ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-top: 40px;
  }
  @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .card-title {
    font-family: Arial, sans-serif;
    font-weight: bold;
    font-size: 1.15rem;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title svg { width: 18px; height: 18px; flex-shrink: 0; }

  /* ── Form elements ── */
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="text"],
  select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 9px 12px;
    font-family: Arial, sans-serif;
    font-size: 0.95rem;
    outline: none;
    margin-bottom: 14px;
  }
  input[type="text"]:focus, select:focus {
    border-color: var(--accent);
  }
  select option { background: var(--surface); }

  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }

  /* ── Drop zone ── */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .dropzone:hover, .dropzone.over {
    border-color: var(--accent);
    background: rgba(232, 200, 122, 0.04);
  }
  .dropzone input[type="file"] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .dropzone-icon { font-size: 2rem; margin-bottom: 8px; }
  .dropzone-text { color: var(--muted); font-size: 0.88rem; }
  .dropzone-text strong { color: var(--text); }

  /* ── File list ── */
  #file-list {
    margin-top: 12px;
    display: flex; flex-direction: column; gap: 6px;
    max-height: 200px; overflow-y: auto;
  }
  .file-item {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: Arial, monospace;
    font-size: 0.78rem;
  }
  .file-item .dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent2);
  }
  .file-item .dot.no-exif { background: var(--muted); }
  .file-item span { color: var(--muted); margin-left: auto; font-size: 0.72rem; }

  /* ── Preview canvas ── */
  #preview-wrap {
    grid-column: 1 / -1;
    display: none;
  }
  #preview-wrap.visible { display: block; }
  #preview-title {
    font-family: Arial, sans-serif; font-weight: bold;
    font-size: 1.1rem; color: var(--accent);
    margin-bottom: 12px;
  }
  #preview-canvas {
    width: 100%; border-radius: var(--radius);
    border: 1px solid var(--border);
    display: block;
  }
  .preview-nav {
    display: flex; align-items: center; gap: 12px;
    margin-top: 10px;
  }
  .preview-nav button {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .preview-nav button:hover { border-color: var(--accent); color: var(--accent); }
  #preview-counter { color: var(--muted); font-size: 0.85rem; }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: none; border-radius: 8px;
    font-family: Arial, sans-serif;
    font-size: 0.92rem; font-weight: 500;
    padding: 11px 22px; cursor: pointer;
    transition: all 0.18s;
    text-decoration: none;
  }
  .btn-primary {
    background: var(--accent);
    color: #0f0f11;
  }
  .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-outline:hover { border-color: var(--accent2); color: var(--accent2); }

  .btn-download {
    background: var(--accent2);
    color: #0f0f11;
  }
  .btn-download:hover { filter: brightness(1.1); transform: translateY(-1px); }

  .actions {
    grid-column: 1 / -1;
    display: flex; gap: 12px; flex-wrap: wrap;
    align-items: center;
  }

  /* ── Status bar ── */
  #status {
    grid-column: 1 / -1;
    font-size: 0.85rem;
    color: var(--muted);
    display: none;
  }
  #status.visible { display: block; }
  #progress-bar-wrap {
    background: var(--border);
    border-radius: 999px;
    height: 4px;
    margin-top: 6px;
  }
  #progress-bar {
    background: var(--accent);
    height: 4px;
    border-radius: 999px;
    width: 0%;
    transition: width 0.2s;
  }

  /* ── Download section ── */
  #download-section {
    grid-column: 1 / -1;
    display: none;
  }
  #download-section.visible { display: block; }

  /* ── CLI card ── */
  .cli-section {
    margin-top: 40px;
    padding-bottom: 60px;
  }
  .cli-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .cli-header {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 8px;
    font-family: Arial, monospace;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .cli-dot { width: 10px; height: 10px; border-radius: 50%; }
  pre {
    padding: 20px;
    font-family: Arial, monospace;
    font-size: 0.85rem;
    line-height: 1.7;
    overflow-x: auto;
    color: var(--text);
  }
  .kw { color: var(--accent); }
  .cm { color: var(--muted); font-style: italic; }
  .val { color: var(--accent2); }
  .flag { color: var(--success); }

  .install-steps {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px; margin: 20px 0;
  }
  .step {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .step-num {
    font-family: Arial, sans-serif; font-weight: bold;
    font-size: 2rem;
    color: var(--border);
    line-height: 1;
    margin-bottom: 6px;
  }
  .step-label { font-size: 0.82rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .step-desc { font-size: 0.88rem; color: var(--text); }

  footer {
    border-top: 1px solid var(--border);
    padding: 24px 0;
    color: var(--muted);
    font-size: 0.82rem;
    text-align: center;
  }
  footer a { color: var(--accent2); text-decoration: none; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="logo">Photo<span>Stamp</span></div>
    <div class="tagline">Overlay EXIF date/time &amp; your name onto photos — right in the browser, no upload needed.</div>
  </header>

  <!-- ════════════════════════ BROWSER TOOL ════════════════════════ -->
  <div class="grid" style="margin-top:40px">

    <!-- Left: controls -->
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Settings
      </div>

      <div class="row">
        <div>
          <label>Stamp position</label>
          <select id="position">
            <option value="bottomright" selected>Bottom right</option>
            <option value="bottomleft">Bottom left</option>
            <option value="topright">Top right</option>
            <option value="topleft">Top left</option>
          </select>
        </div>
        <div>
          <label>Font size</label>
          <select id="fontsize">
            <option value="auto" selected>Auto</option>
            <option value="18">Small (18px)</option>
            <option value="24">Medium (24px)</option>
            <option value="32">Large (32px)</option>
            <option value="48">XL (48px)</option>
          </select>
        </div>
      </div>

      <label>Text color</label>
      <select id="textcolor">
        <option value="255,255,255" selected>White</option>
        <option value="0,0,0">Black</option>
        <option value="255,255,180">Warm yellow</option>
        <option value="180,220,255">Light blue</option>
      </select>

      <label>Background opacity</label>
      <select id="opacity">
        <option value="80">Light (80)</option>
        <option value="140">Medium (140)</option>
        <option value="200" selected>Heavy (200)</option>
        <option value="255">Solid (255)</option>
      </select>
    </div>

    <!-- Right: drop zone -->
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Images
      </div>

      <div class="dropzone" id="dropzone">
        <input type="file" id="file-input" accept="image/*,.heic,.HEIC" multiple />
        <div class="dropzone-icon">🖼️</div>
        <div class="dropzone-text"><strong>Click or drag images here</strong><br>JPG, PNG, TIFF, WebP, HEIC supported</div>
      </div>

      <div id="file-list"></div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" id="process-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Stamp all photos
      </button>
      <button class="btn btn-outline" id="clear-btn">Clear</button>
    </div>

    <!-- Status -->
    <div id="status">
      <span id="status-text">Processing…</span>
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    </div>

    <!-- Preview -->
    <div id="preview-wrap">
      <div id="preview-title">Preview</div>
      <canvas id="preview-canvas"></canvas>
      <div class="preview-nav">
        <button id="prev-btn">← Prev</button>
        <span id="preview-counter"></span>
        <button id="next-btn">Next →</button>
      </div>
    </div>

    <!-- Download -->
    <div id="download-section">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </div>
        <div id="download-links" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
      </div>
    </div>

  </div>


</div>

<footer>
  <div class="wrap">
    PhotoStamp — runs entirely in your browser. Images never leave your device.
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
<script>
/* ──────────────────────────────────────────────────────────────────
   PhotoStamp — browser-side logic
   Uses: Canvas API + exifr (CDN) for EXIF reading
────────────────────────────────────────────────────────────────── */

// We'll read EXIF in a lightweight way using FileReader + DataView
// (no external CDN needed — pure browser)

const fileInput   = document.getElementById('file-input');
const dropzone    = document.getElementById('dropzone');
const fileList    = document.getElementById('file-list');
const processBtn  = document.getElementById('process-btn');
const clearBtn    = document.getElementById('clear-btn');
const statusEl    = document.getElementById('status');
const statusText  = document.getElementById('status-text');
const progressBar = document.getElementById('progress-bar');
const previewWrap = document.getElementById('preview-wrap');
const previewCanvas = document.getElementById('preview-canvas');
const previewCounter = document.getElementById('preview-counter');
const downloadSection = document.getElementById('download-section');
const downloadLinks = document.getElementById('download-links');

let files = [];
let processedBlobs = [];
let previewIndex = 0;

// ── EXIF date extraction (pure JS, no CDN) ──────────────────────
function readExifDate(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const buf = e.target.result;
        const view = new DataView(buf);
        // Find APP1 marker (FF E1) and scan for DateTimeOriginal tag (0x9003)
        let offset = 2;
        while (offset < view.byteLength - 4) {
          const marker = view.getUint16(offset);
          if (marker === 0xFFE1) {
            const app1Len = view.getUint16(offset + 2);
            // Check for Exif header
            const exifHeader = String.fromCharCode(
              view.getUint8(offset+4), view.getUint8(offset+5),
              view.getUint8(offset+6), view.getUint8(offset+7)
            );
            if (exifHeader === 'Exif') {
              const tiffStart = offset + 10;
              const endian = view.getUint16(tiffStart) === 0x4949 ? true : false; // little endian?
              const getUint16 = (o) => endian ? view.getUint16(tiffStart+o, true) : view.getUint16(tiffStart+o, false);
              const getUint32 = (o) => endian ? view.getUint32(tiffStart+o, true) : view.getUint32(tiffStart+o, false);

              // IFD0 offset
              const ifd0Off = getUint32(4);
              const ifd0Count = getUint16(ifd0Off);

              // Look for ExifIFD pointer (0x8769) in IFD0
              let exifIFDOff = -1;
              for (let i = 0; i < ifd0Count; i++) {
                const entryOff = ifd0Off + 2 + i * 12;
                const tag = getUint16(entryOff);
                if (tag === 0x8769) {
                  exifIFDOff = getUint32(entryOff + 8);
                  break;
                }
              }

              if (exifIFDOff >= 0) {
                const exifCount = getUint16(exifIFDOff);
                for (let i = 0; i < exifCount; i++) {
                  const entryOff = exifIFDOff + 2 + i * 12;
                  const tag = getUint16(entryOff);
                  if (tag === 0x9003 || tag === 0x9004) { // DateTimeOriginal / Digitized
                    const valOff = getUint32(entryOff + 8);
                    let dateStr = '';
                    for (let c = 0; c < 19; c++) {
                      dateStr += String.fromCharCode(view.getUint8(tiffStart + valOff + c));
                    }
                    // Parse "2024:06:15 14:32:00"
                    const m = dateStr.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/);
                    if (m) {
                      const dt = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]);
                      resolve(dt.toLocaleString('en-US', {
                        year:'numeric', month:'long', day:'2-digit',
                        hour:'2-digit', minute:'2-digit'
                      }));
                      return;
                    }
                  }
                }
              }
            }
            offset += 2 + app1Len;
          } else if ((marker & 0xFF00) === 0xFF00) {
            offset += 2 + view.getUint16(offset + 2);
          } else {
            break;
          }
        }
      } catch(err) {}
      resolve(null);
    };
    reader.readAsArrayBuffer(file.slice(0, 65536)); // Read only first 64KB
  });
}

// ── Drag & drop ─────────────────────────────────────────────────
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('over');
  handleFiles([...e.dataTransfer.files]);
});
fileInput.addEventListener('change', () => handleFiles([...fileInput.files]));

async function handleFiles(newFiles) {
  const imgs = newFiles.filter(f =>
    f.type.startsWith('image/') ||
    f.name.toLowerCase().endsWith('.heic') ||
    f.type === 'image/heic' || f.type === 'image/heif'
  );
  if (!imgs.length) return;

  for (const f of imgs) {
    let processFile = f;
    // Convert HEIC to JPEG
    if (f.name.toLowerCase().endsWith('.heic') || f.type === 'image/heic' || f.type === 'image/heif') {
      try {
        addFileItem(f, null, true); // show converting state
        const converted = await heic2any({ blob: f, toType: 'image/jpeg', quality: 0.93 });
        const jpegBlob = Array.isArray(converted) ? converted[0] : converted;
        processFile = new File([jpegBlob], f.name.replace(/\.heic$/i, '.jpg'), { type: 'image/jpeg' });
        processFile._originalName = f.name;
      } catch(e) {
        console.error('HEIC conversion failed:', e);
        continue;
      }
    }
    const date = await readExifDate(processFile);
    processFile._exifDate = date;
    if (!processFile._originalName) addFileItem(processFile, date);
    else updateFileItem(processFile._originalName, date);
    files.push(processFile);
  }
  processBtn.disabled = files.length === 0;
}

function addFileItem(f, date, converting = false) {
  const div = document.createElement('div');
  div.className = 'file-item';
  div.id = `fi-${f.name}`;
  div.innerHTML = `
    <div class="dot ${date ? '' : 'no-exif'}"></div>
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
    <span>${converting ? '⏳ converting…' : (date || 'no EXIF')}</span>
  `;
  fileList.appendChild(div);
}

function updateFileItem(originalName, date) {
  const jpgName = originalName.replace(/\.heic$/i, '.jpg');
  const div = document.getElementById(`fi-${originalName}`);
  if (div) {
    div.querySelector('.dot').className = `dot ${date ? '' : 'no-exif'}`;
    div.querySelector('span:first-of-type').textContent = jpgName;
    div.querySelectorAll('span')[1].textContent = date || 'no EXIF';
  }
}

clearBtn.addEventListener('click', () => {
  files = []; processedBlobs = [];
  fileList.innerHTML = '';
  fileInput.value = '';
  processBtn.disabled = true;
  downloadSection.classList.remove('visible');
  previewWrap.classList.remove('visible');
  statusEl.classList.remove('visible');
  downloadLinks.innerHTML = '';
});

// ── Stamp on canvas ─────────────────────────────────────────────
function stampOnCanvas(img, dateStr, position, fontSize, textColor, opacity) {
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const w = canvas.width, h = canvas.height;
  const auto_fs = fontSize === 'auto' ? Math.max(16, Math.round(Math.min(w, h) * 0.025)) : parseInt(fontSize);
  const pad = Math.round(auto_fs * 0.6);
  const lineSpacing = Math.round(auto_fs * 0.3);

  ctx.font = `bold ${auto_fs}px Arial, sans-serif`;
  ctx.textBaseline = 'top';

  const lines = [
    dateStr || 'Date/time: not available'
  ];

  const lineWidths = lines.map(l => ctx.measureText(l).width);
  const blockW = Math.max(...lineWidths) + pad * 2;
  const lineH = auto_fs * 1.25;
  const blockH = lineH * lines.length + lineSpacing * (lines.length - 1) + pad * 2;

  const margin = Math.round(Math.min(w, h) * 0.02);
  let bx, by;
  if (position === 'topleft')     { bx = margin;           by = margin; }
  else if (position === 'topright') { bx = w - blockW - margin; by = margin; }
  else if (position === 'bottomleft') { bx = margin;        by = h - blockH - margin; }
  else                            { bx = w - blockW - margin; by = h - blockH - margin; }

  // Draw rounded rect background
  const r = auto_fs * 0.4;
  ctx.fillStyle = `rgba(0,0,0,${parseInt(opacity)/255})`;
  ctx.beginPath();
  ctx.moveTo(bx + r, by);
  ctx.lineTo(bx + blockW - r, by);
  ctx.quadraticCurveTo(bx + blockW, by, bx + blockW, by + r);
  ctx.lineTo(bx + blockW, by + blockH - r);
  ctx.quadraticCurveTo(bx + blockW, by + blockH, bx + blockW - r, by + blockH);
  ctx.lineTo(bx + r, by + blockH);
  ctx.quadraticCurveTo(bx, by + blockH, bx, by + blockH - r);
  ctx.lineTo(bx, by + r);
  ctx.quadraticCurveTo(bx, by, bx + r, by);
  ctx.closePath();
  ctx.fill();

  // Draw text
  const [cr, cg, cb] = textColor.split(',').map(Number);
  ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
  let cy = by + pad;
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], bx + pad, cy);
    cy += lineH + (i < lines.length - 1 ? lineSpacing : 0);
  }

  return canvas;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { resolve(img); URL.revokeObjectURL(url); };
    img.onerror = reject;
    img.src = url;
  });
}

// ── Process ─────────────────────────────────────────────────────
processBtn.addEventListener('click', async () => {
  const position = document.getElementById('position').value;
  const fontSize = document.getElementById('fontsize').value;
  const textColor = document.getElementById('textcolor').value;
  const opacity = document.getElementById('opacity').value;

  processedBlobs = [];
  downloadLinks.innerHTML = '';
  statusEl.classList.add('visible');
  downloadSection.classList.remove('visible');
  previewWrap.classList.remove('visible');
  progressBar.style.width = '0%';

  for (let i = 0; i < files.length; i++) {
    statusText.textContent = `Processing ${i+1} of ${files.length}: ${files[i].name}`;
    progressBar.style.width = `${Math.round((i / files.length) * 100)}%`;

    try {
      const img = await loadImage(files[i]);
      const canvas = stampOnCanvas(img, files[i]._exifDate, position, fontSize, textColor, opacity);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.93));
      processedBlobs.push({ name: files[i].name, blob });

      // Download link
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `stamped_${files[i].name}`;
      a.className = 'btn btn-download'; a.style.fontSize = '0.82rem'; a.style.padding = '7px 14px';
      a.textContent = `⬇ ${files[i].name}`;
      downloadLinks.appendChild(a);
    } catch(e) {
      console.error(e);
    }
  }

  progressBar.style.width = '100%';
  statusText.textContent = `Done — ${processedBlobs.length} photo${processedBlobs.length !== 1 ? 's' : ''} stamped.`;
  downloadSection.classList.add('visible');

  // Show preview of first image
  if (processedBlobs.length > 0) {
    previewIndex = 0;
    showPreview(0);
    previewWrap.classList.add('visible');
  }
});

async function showPreview(idx) {
  if (!processedBlobs[idx]) return;
  const url = URL.createObjectURL(processedBlobs[idx].blob);
  const img = new Image();
  img.onload = () => {
    previewCanvas.width = img.naturalWidth;
    previewCanvas.height = img.naturalHeight;
    const ctx = previewCanvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
  };
  img.src = url;
  previewCounter.textContent = `${idx + 1} / ${processedBlobs.length}  —  ${processedBlobs[idx].name}`;
}

document.getElementById('prev-btn').addEventListener('click', () => {
  previewIndex = Math.max(0, previewIndex - 1);
  showPreview(previewIndex);
});
document.getElementById('next-btn').addEventListener('click', () => {
  previewIndex = Math.min(processedBlobs.length - 1, previewIndex + 1);
  showPreview(previewIndex);
});
</script>
